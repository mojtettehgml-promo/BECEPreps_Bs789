<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BECE Prep Zone</title>
<meta name="description" content="Fun BECE revision for Integrated Science, Mathematics and Ga."><meta name="theme-color" content="#6d3fe0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--r:18px}
[data-theme=sunny]{--bg:#fff3c4;--bg2:#ffe066;--card:#fff;--card2:#ffefb0;--ink:#2a2352;--muted:#655d8a;--line:#ffd24d;--brand:#7a35f0;--brand2:#f2386e;--accent:#0a9b7a;--on:#fff;--ok:#0a8a66;--okbg:#d8f6ec;--bad:#d1334a;--badbg:#ffe2e6;--sel:#ffe98a;--shadow:0 3px 0 rgba(109,63,224,.08),0 16px 32px -18px rgba(109,63,224,.45);color-scheme:light}
[data-theme=candy]{--bg:#ffe9f8;--bg2:#fbbdea;--card:#fff;--card2:#ffdff4;--ink:#3b1245;--muted:#7a4f8d;--line:#f7aee3;--brand:#c21fd0;--brand2:#8444f5;--accent:#0e8f9b;--on:#fff;--ok:#0b8a63;--okbg:#d9f6ec;--bad:#cf2f4a;--badbg:#ffe2e8;--sel:#ffd2f0;--shadow:0 3px 0 rgba(176,30,149,.08),0 16px 32px -18px rgba(176,30,149,.45);color-scheme:light}
[data-theme=ocean]{--bg:#dff3ff;--bg2:#a6dcff;--card:#fff;--card2:#d2ecff;--ink:#0d2b4a;--muted:#46637f;--line:#9fd2f5;--brand:#0a77d6;--brand2:#0792a8;--accent:#e07a00;--on:#fff;--ok:#0a8a66;--okbg:#d8f6ec;--bad:#c92a42;--badbg:#ffe2e6;--sel:#c2e5ff;--shadow:0 3px 0 rgba(11,111,194,.08),0 16px 32px -18px rgba(11,111,194,.45);color-scheme:light}
[data-theme=jungle]{--bg:#e8fbdc;--bg2:#b8f08f;--card:#fff;--card2:#d8f6c4;--ink:#17361d;--muted:#47664b;--line:#a9e68d;--brand:#12883b;--brand2:#e36500;--accent:#7c3aed;--on:#fff;--ok:#0a7d4f;--okbg:#d3f5e3;--bad:#c92a42;--badbg:#ffe2e6;--sel:#cdf4ae;--shadow:0 3px 0 rgba(31,138,59,.08),0 16px 32px -18px rgba(31,138,59,.45);color-scheme:light}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 'Fredoka','Segoe UI',system-ui,sans-serif;min-height:100vh}
h1,h2,h3{margin:0;line-height:1.2}button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}.wrap{width:min(960px,100%);margin:0 auto;padding:0 16px}
:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);font-weight:600;cursor:pointer;transition:transform .1s}
.btn:hover:not(:disabled){transform:translateY(-2px)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:linear-gradient(120deg,var(--brand),var(--brand2));color:var(--on);border-color:transparent;box-shadow:var(--shadow)}
.btn.good{background:var(--ok);color:#fff;border-color:transparent}.btn.danger{background:var(--badbg);color:var(--bad);border-color:transparent}
.btn.sm{min-height:36px;padding:4px 12px;font-size:15px;border-radius:12px}.btn.big{min-height:56px;font-size:20px;padding:12px 28px}
.link{background:none;border:0;color:var(--brand);text-decoration:underline;cursor:pointer;padding:0}
input,select,textarea{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:#222}
textarea{min-height:100px;resize:vertical}label.f{display:block;font-weight:600;margin:10px 0 0}label.f input,label.f select,label.f textarea{margin-top:6px;font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:620px){.two{grid-template-columns:1fr}}
.panel{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:20px;margin:16px 0;box-shadow:var(--shadow)}
.panel h3{margin-bottom:6px}.hint,.meta{color:var(--muted);font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.msg{padding:10px 14px;border-radius:14px;margin:10px 0;font-weight:500}.msg.err{background:var(--badbg);color:var(--bad)}.msg.okm{background:var(--okbg);color:var(--ok)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;z-index:80;font-weight:600;max-width:90vw}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--okbg);color:var(--ok);margin-left:6px}.badge.d{background:var(--badbg);color:var(--bad)}.badge.a{background:var(--sel);color:var(--brand)}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--sel);color:var(--brand)}.tag.new{background:var(--brand2);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}.cchip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border-radius:999px;padding:4px 12px;font-weight:600}
.cchip.ok{background:var(--ok);color:#fff}
.ucard{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
/* hero + nav */
.hero{background:linear-gradient(130deg,var(--brand),var(--brand2));color:#fff;border-radius:0 0 32px 32px;box-shadow:var(--shadow)}
.hero .wrap{padding-top:18px;padding-bottom:20px}.hero h1{font-size:clamp(26px,6vw,38px)}.lede{margin:6px 0 0;opacity:.96}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.brandn{font-weight:700;font-size:18px}
.herorow{display:flex;gap:16px;align-items:center}.mascot{font-size:72px;line-height:1;display:inline-block;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-5deg)}}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.stat{background:rgba(255,255,255,.22);border-radius:18px;padding:8px 14px;min-width:96px}.stat b{font-size:24px;display:block}.stat small{opacity:.95}
.lvl{min-width:180px;flex:1}.sprog{display:block;height:8px;background:rgba(255,255,255,.3);border-radius:6px;overflow:hidden;margin-top:6px}.sprog i{display:block;height:100%;background:#fff;border-radius:6px}
.hero .btn{background:rgba(255,255,255,.2);color:#fff;border-color:transparent}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:50}
.bnav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:0;font-weight:600;font-size:13px;color:var(--muted);padding:4px 18px;border-radius:14px;cursor:pointer;position:relative}
.bnav button.on{color:var(--brand);background:var(--card2)}.bnav .em{font-size:24px;line-height:1.1}
.dot{position:absolute;top:0;right:10px;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
main.wrap{padding-bottom:110px}
.subjgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;margin:20px 0}
.subj{display:flex;gap:14px;align-items:center;text-align:left;border:0;border-radius:26px;padding:18px;color:#fff;background:linear-gradient(130deg,var(--c1),var(--c2));box-shadow:var(--shadow);transition:transform .15s;cursor:pointer;width:100%}
.subj:hover{transform:translateY(-4px) rotate(-.4deg)}.subj .mas{font-size:50px;background:rgba(255,255,255,.25);border-radius:22px;width:84px;height:84px;display:grid;place-items:center;flex:none}
.subj .sbody{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}.subj b{font-size:21px}.subj small{opacity:.97}.subj .cchip{background:rgba(255,255,255,.25);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
.tile:hover:not(:disabled){transform:translateY(-3px);border-color:var(--brand)}.tile:disabled{opacity:.55;cursor:not-allowed}.tile .tic{font-size:38px;line-height:1.1}.tile b{font-size:18px}.tile small{color:var(--muted)}
.lessons{display:grid;gap:12px;margin:16px 0 30px}
.lesson{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow)}
.lesson:hover{border-color:var(--brand)}.lno{width:48px;height:48px;border-radius:50%;background:var(--brand);color:var(--on);display:grid;place-items:center;font-weight:700;flex:none;font-size:22px}
.lesson.read .lno{background:var(--ok)}.lesson b{display:block}.lesson small{color:var(--muted);display:block}
.panel.soon{text-align:center;padding:34px 18px}
/* reader */
.reader{background:var(--card);border:2px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:22px;margin-top:16px;min-height:300px;touch-action:pan-y}
.reader h2{color:var(--brand);margin-bottom:8px}.dots{display:flex;gap:8px;justify-content:center;margin:14px 0}.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--brand2);transform:scale(1.25)}
.rich{font-size:19px;line-height:1.7}.rich p{margin:.6em 0}.rich ul,.rich ol{padding-left:1.4em;margin:.5em 0}.rich li{margin:.3em 0}.rh{margin:1em 0 .3em;color:var(--brand)}
.callout{background:var(--sel);border-left:6px solid var(--brand2);border-radius:12px;padding:10px 14px;margin:12px 0}
.hl{background:color-mix(in srgb,#fde047 60%,transparent);color:inherit;border-radius:4px;padding:0 3px}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;line-height:1.15;margin:0 3px}.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px}.frac>span:last-child{padding:0 4px}.rad{border-top:1.5px solid currentColor;padding:0 2px;margin-left:1px}
/* questions */
.qbar{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:2px solid var(--line);padding:10px 0}.qbar .wrap{display:flex;gap:12px;align-items:center}
.pb{height:10px;background:var(--card2);border-radius:6px;flex:1;overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:6px;transition:width .3s}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:20px;margin:16px 0;box-shadow:var(--shadow)}
.qn{font-weight:700;font-size:13px;letter-spacing:.08em;color:var(--brand2)}.qtext{font-weight:600;font-size:clamp(20px,4.2vw,27px);margin:6px 0 14px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:10px 0;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:var(--card);font-size:18px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--brand)}.opt .l{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700;flex:none}
.opt.sel{background:var(--sel);border-color:var(--brand)}.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.fib input{font-size:20px;text-align:center}.fbk{margin-top:12px;padding:12px 14px;border-radius:14px;font-weight:600}.fbk.ok{background:var(--okbg);color:var(--ok)}.fbk.no{background:var(--badbg);color:var(--bad)}.fbk .rich{font-weight:400;font-size:16px}
.model{background:var(--card2);border-radius:14px;padding:10px 14px;margin-top:10px}.mark{margin-top:12px;padding:12px 14px;background:var(--card2);border:1px solid var(--line);border-radius:16px}
.pt{display:flex;gap:10px;align-items:flex-start;padding:6px 0}.pt input{width:auto;margin-top:6px}.cchip.pick{cursor:pointer;border:0;font-weight:700;font-size:16px;padding:6px 14px}
.res{background:var(--card);border:2px solid var(--line);border-radius:28px;padding:26px;text-align:center;box-shadow:var(--shadow);margin:18px 0}.res .big{font-size:64px;font-weight:700;color:var(--brand);line-height:1.1}
.stars{font-size:38px;letter-spacing:4px}
.markbox{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.markbox .big{font:700 64px/1 'Fredoka',sans-serif;color:var(--brand)}.markbox .big small{font-size:24px;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin:12px 0}.thumbs figure{margin:0}.thumbs img{width:100%;border-radius:12px;border:1px solid var(--line);background:#fff}.thumbs figcaption{font-size:13px;color:var(--muted);text-align:center}
.pgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.pg{width:100%;border:1px solid var(--line);border-radius:10px;cursor:zoom-in;background:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:90;display:grid;place-items:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}.confetti span{position:absolute;top:-30px;animation:fall 2.6s ease-in forwards}@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 480px at 15% -10%,var(--bg2),transparent 60%),radial-gradient(800px 420px at 100% 110%,var(--bg2),transparent 60%),var(--bg)}
.authbox{width:min(460px,100%)}.authhead{text-align:center;margin-bottom:16px}.authhead h1{font-size:clamp(30px,8vw,44px);color:var(--brand)}.authhead .mascot{font-size:84px}
.tabs{display:flex;gap:8px;margin-bottom:6px}.tabs button{flex:1;padding:10px;border:2px solid var(--line);background:var(--card);border-radius:14px;font-weight:700;cursor:pointer}.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.themes{display:flex;gap:10px;flex-wrap:wrap}.th{width:64px;height:64px;border-radius:18px;border:4px solid transparent;cursor:pointer;font-size:26px}.th.on{border-color:var(--ink)}
.admtabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.admtabs button{padding:8px 16px;border:2px solid var(--line);background:var(--card);border-radius:999px;font-weight:700;cursor:pointer}.admtabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.qed{border:2px solid var(--line);border-radius:16px;padding:12px;margin:10px 0;background:var(--card2)}.qed textarea{min-height:60px}.qed .row{display:flex;gap:8px;align-items:center;margin-top:6px}.qed .row input[type=radio]{width:auto}
.prev{background:var(--bg);border:2px dashed var(--line);border-radius:16px;padding:12px;margin-top:8px}
@media(max-width:700px){.herorow{flex-direction:column;align-items:flex-start;gap:6px}.mascot{font-size:56px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* v1.1 */
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 4px}.pill{padding:8px 18px;border:2px solid var(--line);border-radius:999px;background:var(--card);font-weight:700;cursor:pointer}.pill.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.topic{background:var(--card);border:2px solid var(--line);border-radius:24px;margin:14px 0;box-shadow:var(--shadow);overflow:hidden}.topic>summary{display:flex;gap:14px;align-items:center;padding:14px 16px;cursor:pointer;list-style:none}.topic>summary::-webkit-details-marker{display:none}
.tdot{width:46px;height:46px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}.ttxt{flex:1;min-width:0}.ttxt b{display:block;font-size:18px}.ttxt small{color:var(--muted)}.tbar{display:block;height:8px;background:var(--card2);border-radius:6px;margin-top:6px;overflow:hidden}.tbar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.path{padding:4px 16px 16px;display:grid;gap:10px;position:relative}.step{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:18px;background:var(--bg);cursor:pointer}.step:hover{border-color:var(--brand)}
.sno{width:42px;height:42px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}.step.read .sno{background:var(--ok)}.step.test .sno{background:var(--brand2)}.stx b{display:block}.stx small{color:var(--muted)}
.lpb{display:flex;gap:6px;margin-top:10px}.lpb i{flex:1;height:8px;border-radius:6px;background:rgba(255,255,255,.3)}.lpb i.on{background:#fff}
.reader.card{border:0;border-top:10px solid var(--cc);border-radius:28px;padding:20px 22px;animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.4}}
.reader h2{color:var(--cc);font-size:clamp(24px,5vw,30px)}.rich b{color:var(--cc,var(--brand));font-weight:700}
.callout.try{background:#e6f7ff;border-color:#0ea5e9}.callout.goal{background:#fff3d6;border-color:#f59e0b}.callout.know{background:#f1e8ff;border-color:#8b5cf6}
.tw{overflow-x:auto;margin:12px 0;border-radius:14px;border:2px solid var(--line)}.rich table{border-collapse:collapse;width:100%;font-size:16px;line-height:1.4}.rich th{background:var(--cc,var(--brand));color:#fff;text-align:left;padding:8px 10px}.rich td{padding:8px 10px;border-top:1px solid var(--line)}.rich tr:nth-child(even) td{background:var(--card2)}
.figw{display:block;text-align:center;margin:12px 0}.pic{max-width:100%;max-height:340px;border-radius:16px;border:2px solid var(--line);background:#fff}.cap{display:block;font-size:14px;color:var(--muted);margin-top:4px}
.picslot{display:block;border:2px dashed var(--brand2);border-radius:14px;padding:14px;text-align:center;color:var(--muted);margin:10px 0;font-size:15px}
.idea{display:flex;gap:8px;align-items:flex-start;padding:6px 0}.idea.ok{color:var(--ok);font-weight:600}.idea.no{color:var(--muted)}.idea .ic{flex:none}
.rich th b,.rich th{color:#fff}.rich table{min-width:430px;font-size:15px}.rich th,.rich td{padding:7px 9px;vertical-align:top}.rich td:first-child{font-weight:600}.rich td b{color:inherit}
.tw{-webkit-overflow-scrolling:touch}
.rich table{min-width:380px;font-size:14px}.rich td:first-child{width:28%}
.bankp{margin:14px auto 4px;max-width:420px;text-align:left}.bankp-t{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-bottom:6px}.pbarw{height:12px;border-radius:99px;background:rgba(0,0,0,.1);overflow:hidden}.pbarw i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand,#7c3aed),var(--brand2,#f59e0b))}

/* v1.2 banner: layered colour, floating subject icons, sparkle */
.hero{position:relative;overflow:hidden;isolation:isolate;border-radius:0 0 40px 40px;background:
 radial-gradient(circle at 8% 25%,rgba(255,255,255,.30) 0 7%,transparent 7.5%),
 radial-gradient(circle at 93% 18%,rgba(255,255,255,.22) 0 13%,transparent 13.5%),
 radial-gradient(circle at 62% 125%,rgba(255,255,255,.28) 0 26%,transparent 26.5%),
 radial-gradient(circle at 30% 120%,rgba(255,220,120,.35) 0 16%,transparent 16.5%),
 repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 14px,transparent 14px 28px),
 linear-gradient(125deg,var(--brand),var(--brand2) 60%,#ffd36b 140%)}
.hero .wrap{position:relative;z-index:2;padding-top:20px;padding-bottom:26px}
.hero h1{text-shadow:0 3px 0 rgba(0,0,0,.14),0 8px 18px rgba(0,0,0,.16)}
.hero .lede{display:inline-block;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:999px;font-weight:700;backdrop-filter:blur(2px)}
.deco{position:absolute;inset:0;z-index:1;pointer-events:none}
.deco i{position:absolute;font-style:normal;font-size:30px;opacity:.85;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18));animation:flo 6s ease-in-out infinite}

    app.innerHTML=`<header class="hero" style="--brand:${s.c1};--brand2:${s.c2}">${deco(s.id,1)}<div class="wrap"><div class="topbar"><button class="btn sm" id="bk">← Lessons list</button><span class="brandn">Teacher view · ${lvlName(L.level)} · <span class="badge ${L.status==='published'?'':'d'}">${L.status}</span></span></div><h1>${esc(L.emoji)} ${esc(L.title)}</h1>${isT?'':`<div class="lpb">${L.pages.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div>`}</div></header>
    <main class="wrap"><div class="panel abar"><div class="actions" style="margin:0">${isT?'':`<button class="btn sm primary" id="ed">✏️ ${editing?'Editing this page':'Edit this page'}</button>`}<button class="btn sm" id="full">Full editor (questions, all pages)</button><button class="btn sm" id="stt">${L.status==='published'?'Unpublish':'Publish'}</button><span class="hint" style="margin-left:auto">${esc(L.topic||'')} · lesson ${at+1} of ${sib.length}</span></div></div>
    ${isT?'<div class="panel"><p class="hint">This is a test with questions only (no reading pages).</p></div>':editing?`<div class="panel edbox"><label class="f">Page title<input id="et" value="${esc(p.title||'')}"></label><label class="f">Text <span class="hint">**bold** ==highlight== ## heading - bullet 1. step &gt; tip</span><textarea id="eb" style="min-height:320px">${esc(p.body)}</textarea></label><div class="actions"><button class="btn good" id="es">Save this page</button><button class="btn" id="ec">Cancel</button><button class="btn" id="ea">＋ Add a page after this</button>${L.pages.length>1?'<button class="btn danger" id="er">Remove this page</button>':''}</div><div id="em"></div><h3 style="margin-top:14px">Live preview</h3><article class="reader card" style="--cc:${col}"><h2 id="pt">${esc(p.title||'')}</h2><div class="rich" id="pb">${rich(p.body)}</div></article></div>`
    :`<article class="reader card" id="rd" style="--cc:${col}">${p.title?`<h2>${esc(p.title)}</h2>`:''}<div class="rich">${rich(p.body)}</div></article>`}
    ${isT?'':`<div class="actions" style="justify-content:space-between"><button class="btn" id="pv" ${i?'':'disabled'}>◀ Page back</button><span class="hint">Page ${i+1} of ${L.pages.length}</span><button class="btn primary" id="nx" ${i<L.pages.length-1?'':'disabled'}>Page next ▶</button></div>`}

    $('#bk').onclick=()=>adminHome('lessons');$('#full').onclick=()=>lessonEditor(L);

    if(!isT){$('#pv').onclick=()=>{i--;editing=false;paint();window.scrollTo(0,0)};$('#nx').onclick=()=>{i++;editing=false;paint();window.scrollTo(0,0)}}
    $('#pl').onclick=()=>prevL&&adminRead(prevL.id);$('#nl').onclick=()=>nextL&&adminRead(nextL.id);
    if(editing){const et=$('#et'),eb=$('#eb');const live=()=>{$('#pt').textContent=et.value;$('#pb').innerHTML=rich(eb.value)};et.oninput=live;eb.oninput=live;
      $('#ec').onclick=()=>{editing=false;paint()};
      const save=async(after)=>{L.pages[i]={...L.pages[i],title:et.value,body:eb.value};if(after)L.pages.splice(i+1,0,{title:'',body:''});const x=await api('lessonSave',{...L});if(!x.ok){$('#em').innerHTML=`<div class="msg err">${esc(x.error)}</div>`;return false}toast('Saved');return true};
      $('#es').onclick=async()=>{if(await save(false)){editing=false;paint()}};
      $('#ea').onclick=async()=>{if(await save(true)){i++;editing=true;paint();window.scrollTo(0,0)}};
      const er=$('#er');if(er)er.onclick=async()=>{if(!confirm('Remove this page?'))return;L.pages.splice(i,1);const x=await api('lessonSave',{...L});if(!x.ok){toast(x.error);return}i=Math.max(0,i-1);editing=false;paint()}}}
  paint()}
/* ---------- lesson editor ---------- */
function lessonEditor(L0,fresh){

  const draw=()=>{
    const qh=(q,i)=>{const head=`${q.t==='mcq'?'Multiple choice':q.t==='fib'?'Fill-in':'Structured'}${q.auto?' (auto-made, please check)':''}: ${String(q.q||'').slice(0,60)}`;

      else if(q.t==='fib')body=`<label class="f">Sentence with one blank written as ___<textarea data-q="${i}" data-f="q">${esc(q.q)}</textarea></label><label class="f">Correct answer (separate accepted alternatives with |)<input data-q="${i}" data-f="a" value="${esc(q.a||'')}"></label><label class="f">Explanation (optional)<input data-q="${i}" data-f="e" value="${esc(q.e||'')}"></label>`;
      else body=`<label class="f">Question<textarea data-q="${i}" data-f="q">${esc(q.q)}</textarea></label>${q.parts.map((p,k)=>`<div class="qed" style="background:var(--card)"><b>Part ${'abcdefgh'[k]}</b> <button class="btn sm danger" data-rp="${i}:${k}" style="float:right">remove</button><label class="f">Part question<textarea data-pp="${i}:${k}:q">${esc(p.q)}</textarea></label><div class="two"><label class="f">Marks<input type="number" min="1" max="20" data-pp="${i}:${k}:m" value="${p.m}"></label><div></div></div><div class="f"><b>Key ideas</b> <span class="hint">A learner earns a mark for each idea found in their answer. An idea is found when the answer contains any one of its key words, so add different ways of saying it.</span>${(p.ideas||[]).map((x,j)=>`<div class="row"><input data-id="${i}:${k}:${j}:t" value="${esc(x.t)}" placeholder="The idea"><input data-id="${i}:${k}:${j}:k" value="${esc((x.k||[]).join(', '))}" placeholder="key words, separated by commas"><button class="btn sm danger" data-ri="${i}:${k}:${j}">✕</button></div>`).join('')}<button class="btn sm" data-ai="${i}:${k}" style="margin-top:6px">＋ key idea</button></div><label class="f">Model answer (shown after the learner checks)<textarea data-pp="${i}:${k}:a">${esc(p.a||'')}</textarea></label></div>`).join('')}<button class="btn sm" data-ap="${i}">＋ part</button>`;
      return `<details class="qed" ${fresh||q.auto?'':''}><summary><b>${i+1}.</b> ${esc(head)}</summary>${body}<div class="actions"><button class="btn sm danger" data-rq="${i}">Delete question</button><button class="btn sm" data-mv="${i}:-1">↑</button><button class="btn sm" data-mv="${i}:1">↓</button></div></details>`};
    app.innerHTML=`<header class="hero"><div class="wrap"><div class="topbar"><button class="btn sm" id="bk">← Lessons</button><span class="brandn">${ED.id?'Edit lesson':'New lesson'}</span></div></div></header><main class="wrap" style="padding-bottom:60px">
    ${L0._warn&&L0._warn.length?`<div class="msg err"><b>These questions in your file could not be read:</b><br>${L0._warn.map(esc).join('<br>')}</div>`:''}
    <div class="panel"><div class="two"><label class="f">Title<input id="lt" value="${esc(ED.title)}"></label><label class="f">Subject<select id="ls">${SUBJ.map(s=>`<option value="${s.id}" ${ED.subject===s.id?'selected':''}>${s.title}</option>`).join('')}</select></label></div><div class="two"><label class="f">Class<select id="lv">${LVL.map(l=>`<option value="${l[0]}" ${(ED.level||'b7')===l[0]?'selected':''}>${l[1]}</option>`).join('')}</select></label><label class="f">Topic (lessons with the same topic are grouped)<input id="ltp" value="${esc(ED.topic||'')}" placeholder="e.g. 1.1 Materials"></label></div><div class="two"><label class="f">Type<select id="lk"><option value="learn" ${ED.kind!=='test'&&ED.kind!=='bank'?'selected':''}>Mini-lesson (reading)</option><option value="test" ${ED.kind==='test'?'selected':''}>Topic test (questions only)</option><option value="bank" ${ED.kind==='bank'?'selected':''}>Question bank (hidden from the path, used for random practice)</option></select></label><label class="f">Emoji<input id="le" maxlength="4" value="${esc(ED.emoji)}"></label></div><div class="two"><label class="f">Order in the topic<input id="lo" type="number" min="0" max="9999" value="${ED.order}"></label></div><p class="hint">Source: ${esc(ED.source||'typed by hand')}</p></div>
    <div class="panel"><h3>Reading pages (${ED.pages.length})</h3><p class="hint">Aim for 2 to 3 short, lively pages. Formatting: <code>**bold**</code> <code>==highlight==</code> <code>## heading</code> <code>- bullet</code> <code>1. step</code> <code>&gt; tip</code> <code>^{2}</code> <code>_{2}</code> <code>[[1/2]]</code></p>
    ${ED.pages.map((p,i)=>`<div class="qed"><b>Page ${i+1}</b> ${ED.pages.length>1?`<button class="btn sm danger" data-rg="${i}" style="float:right">remove page</button>`:''}<label class="f">Page title<input data-pg="${i}:title" value="${esc(p.title)}"></label><label class="f">Text<textarea data-pg="${i}:body" style="min-height:200px">${esc(p.body)}</textarea></label>${(p.body.match(/\[\[pic:[^\]]*\]\]/g)||[]).map((m,j)=>`<div class="picslot">🖼 ${esc(m.slice(6,-2).trim())} <label class="btn sm" style="cursor:pointer">Upload for this slot<input type="file" accept="image/*" hidden data-slot="${i}:${j}"></label></div>`).join('')}<div class="actions"><label class="btn sm" style="cursor:pointer">🖼 Add a picture<input type="file" accept="image/*" hidden data-pic="${i}"></label></div></div>`).join('')}
    <div class="actions"><button class="btn sm" id="ag">＋ Add a page</button><button class="btn sm" id="pv">${showPrev?'Hide':'Show'} preview</button></div>${showPrev?ED.pages.map((p,i)=>`<div class="prev"><div class="qn">PAGE ${i+1}</div>${p.title?`<h3 style="color:var(--brand)">${esc(p.title)}</h3>`:''}<div class="rich">${rich(p.body)}</div></div>`).join(''):''}</div>
    <div class="panel"><h3>Test questions (${ED.questions.length})</h3><p class="hint">Learners take multiple choice first, then fill-in, then structured questions.</p>${ED.questions.map(qh).join('')||'<p class="hint">None yet.</p>'}
    <div class="actions"><button class="btn sm" data-nq="mcq">＋ Multiple choice</button><button class="btn sm" data-nq="st">＋ Structured</button></div>
    <details><summary><b>Paste or upload questions as text</b></summary><p class="hint">Format:<br><code>1. Question text</code> · <code>A. option</code> … · <code>Answer: B</code> · <code>Explain: why</code><br><code>Fill: Plants make food by ___. Answer: photosynthesis|photo synthesis</code><br><code>Structured: Question</code> then <code>(a) Part text [2] Answer: point one; point two</code></p><textarea id="pq" style="min-height:160px" placeholder="Paste questions here"></textarea><div class="actions"><label class="btn sm" style="cursor:pointer">Upload Word/PDF of questions<input type="file" id="pqf" accept=".docx,.pdf" hidden></label><button class="btn sm primary" id="pqb">Add these questions</button></div><div id="pqm"></div></details></div>
    <div id="em"></div><div class="actions" style="position:sticky;bottom:8px"><button class="btn primary big" id="sv">Save draft</button><button class="btn good big" id="pb">Save &amp; publish</button></div></main>`;
    wire()};
  const wire=()=>{
    $('#bk').onclick=()=>{if(confirm('Leave without saving?'))adminHome('lessons')};
    $('#lt').oninput=e=>ED.title=e.target.value;$('#ls').onchange=e=>ED.subject=e.target.value;$('#le').oninput=e=>ED.emoji=e.target.value;$('#lv').onchange=e=>ED.level=e.target.value;$('#ltp').oninput=e=>ED.topic=e.target.value;$('#lk').onchange=e=>{ED.kind=e.target.value};$('#lo').oninput=e=>ED.order=e.target.value;
    app.querySelectorAll('[data-pg]').forEach(el=>el.oninput=()=>{const [i,f]=el.dataset.pg.split(':');ED.pages[+i][f]=el.value});
    app.querySelectorAll('[data-rg]').forEach(b=>b.onclick=()=>{ED.pages.splice(+b.dataset.rg,1);draw()});const upPic=async f=>{const x=await api('imgSave',{d:await compressForUpload(await drawableOf(f))});if(!x.ok)throw new Error(x.error);return x.id};
    app.querySelectorAll('input[data-pic]').forEach(el=>el.onchange=async()=>{try{const id=await upPic(el.files[0]);const p=ED.pages[+el.dataset.pic];p.body=(p.body?p.body.replace(/\s+$/,'')+'\n\n':'')+'[[img:'+id+']]';toast('Picture added');draw()}catch(e){toast(e.message||'Could not add that picture')}});
    app.querySelectorAll('input[data-slot]').forEach(el=>el.onchange=async()=>{try{const [i,j]=el.dataset.slot.split(':').map(Number),id=await upPic(el.files[0]),p=ED.pages[i];let n=-1;p.body=p.body.replace(/\[\[pic:([^\]]*)\]\]/g,(m,d)=>++n===j?'[[img:'+id+'|'+d.trim().slice(0,80).replace(/[\]|]/g,'')+']]':m);toast('Picture added');draw()}catch(e){toast(e.message||'Could not add that picture')}});
    $('#ag').onclick=()=>{ED.pages.push({title:'',body:''});draw()};$('#pv').onclick=()=>{showPrev=!showPrev;draw()};
    app.querySelectorAll('[data-q]').forEach(el=>el.oninput=()=>{ED.questions[+el.dataset.q][el.dataset.f]=el.value});
    app.querySelectorAll('[data-o]').forEach(el=>el.oninput=()=>{const [i,k]=el.dataset.o.split(':');ED.questions[+i].o[+k]=el.value});
    app.querySelectorAll('[data-c]').forEach(el=>el.onchange=()=>{const [i,k]=el.dataset.c.split(':');ED.questions[+i].c=+k});
    app.querySelectorAll('[data-ao]').forEach(b=>b.onclick=()=>{ED.questions[+b.dataset.ao].o.push('');draw()});
    app.querySelectorAll('[data-ro]').forEach(b=>b.onclick=()=>{const [i,k]=b.dataset.ro.split(':').map(Number),q=ED.questions[i];q.o.splice(k,1);if(q.c>=q.o.length)q.c=0;draw()});
    app.querySelectorAll('[data-pp]').forEach(el=>el.oninput=()=>{const [i,k,f]=el.dataset.pp.split(':'),p=ED.questions[+i].parts[+k];if(f==='m')p.m=+el.value;else p[f]=el.value});
    app.querySelectorAll('[data-id]').forEach(el=>el.oninput=()=>{const [i,k,j,f]=el.dataset.id.split(':'),x=ED.questions[+i].parts[+k].ideas[+j];if(f==='t')x.t=el.value;else x.k=el.value.split(',').map(z=>z.trim()).filter(Boolean)});
    app.querySelectorAll('[data-ai]').forEach(b=>b.onclick=()=>{const [i,k]=b.dataset.ai.split(':').map(Number),p=ED.questions[i].parts[k];(p.ideas=p.ideas||[]).push({t:'',k:[]});draw()});
    app.querySelectorAll('[data-ri]').forEach(b=>b.onclick=()=>{const [i,k,j]=b.dataset.ri.split(':').map(Number);ED.questions[i].parts[k].ideas.splice(j,1);draw()});
    app.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>{ED.questions[+b.dataset.ap].parts.push({q:'',m:1,a:'',ideas:[]});draw()});
    app.querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>{const [i,k]=b.dataset.rp.split(':').map(Number);ED.questions[i].parts.splice(k,1);draw()});
    app.querySelectorAll('[data-rq]').forEach(b=>b.onclick=()=>{ED.questions.splice(+b.dataset.rq,1);draw()});
    app.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{const [i,d]=b.dataset.mv.split(':').map(Number),j=i+d;if(j<0||j>=ED.questions.length)return;[ED.questions[i],ED.questions[j]]=[ED.questions[j],ED.questions[i]];draw()});
    app.querySelectorAll('[data-nq]').forEach(b=>b.onclick=()=>{const t=b.dataset.nq;ED.questions.push(t==='mcq'?{t,q:'',o:['',''],c:0,e:''}:t==='fib'?{t,q:'',a:'',e:''}:{t,q:'',parts:[{q:'',m:1,a:'',ideas:[]}]});draw();const ds=app.querySelectorAll('details.qed');if(ds.length){const d=ds[ds.length-1];d.open=true;d.scrollIntoView({block:'center'})}});
    const addText=txt=>{const r=parseQs(txt),pm=$('#pqm');ED.questions.push(...r.qs);pm.innerHTML=`<div class="msg ${r.qs.length?'okm':'err'}">${r.qs.length} question${r.qs.length===1?'':'s'} added.${r.warn.length?'<br>Could not read: '+r.warn.map(esc).join('<br>'):''}</div>`;if(r.qs.length)setTimeout(draw,r.warn.length?2500:600)};

    const save=async st=>{const em=$('#em');ED.status=st;const x=await api('lessonSave',{...ED,order:ED.order});if(!x.ok){em.innerHTML=`<div class="msg err">${esc(x.error)}</div>`;em.scrollIntoView({block:'center'});return}toast(st==='published'?'Published! Learners can see it.':'Draft saved');adminHome('lessons')};
    $('#sv').onclick=()=>save('draft');$('#pb').onclick=()=>save('published')};
  draw()}
/* ---------- homework (administrator) ---------- */
async function adminAssign(ap,view){
  if(view&&view.subs)return adminAsgSubs(ap,view.subs);
  const r=await api('asgAdminList');if(!r.ok){ap.innerHTML=`<div class="msg err">${esc(r.error)}</div>`;return}
  const edit=view&&view.edit?r.assignments.find(a=>a.id===view.edit):null;
  ap.innerHTML=`<div class="panel"><h3>${edit?'Edit homework':'New homework'}</h3><p class="hint">Learners see this under Homework. They photograph their work and upload it, and you mark it here.</p>
  <div class="two"><label class="f">Title<input id="at" value="${esc(edit?edit.title:'')}"></label><label class="f">Subject<select id="as">${SUBJ.map(m=>`<option value="${m.id}" ${edit&&edit.subject===m.id?'selected':''}>${m.title}</option>`).join('')}</select></label></div>
  <div class="two"><label class="f">Marked out of<input id="am" type="number" min="1" max="1000" value="${edit?edit.max:20}"></label><label class="f">Due date (optional)<input id="ad" type="date" value="${esc(edit?edit.due:'')}"></label></div>
  <label class="f">Instructions<textarea id="ai" style="min-height:120px" placeholder="What should they do? You can use **bold**, - bullets and 1. steps.">${esc(edit?edit.instructions:'')}</textarea></label>
  ${edit?`<label style="display:flex;gap:8px;margin:10px 0"><input type="checkbox" id="ac" style="width:auto" ${edit.closed?'checked':''}> Closed (learners can no longer hand in)</label>`:''}
  <div class="actions"><button class="btn primary" id="asv">${edit?'Save changes':'Publish homework'}</button>${edit?'<button class="btn" id="acn">Cancel</button>':''}</div><div id="amg"></div></div>
  <div class="panel"><h3>Homework (${r.assignments.length})</h3>${r.assignments.map(a=>`<div class="ucard"><div><b>${esc(a.title)}</b>${a.closed?'<span class="badge d">closed</span>':''}<div class="meta">${esc(subj(a.subject).title)} · out of ${a.max}${a.due?' · due '+dueTxt(a.due):''}</div><div class="meta">📥 ${a.submitted} to mark · ✅ ${a.marked} marked${a.returned?` · ↩ ${a.returned} returned`:''}</div></div><div class="actions" style="margin:0"><button class="btn sm primary" data-o="${a.id}">Open &amp; mark</button><button class="btn sm" data-e="${a.id}">Edit</button><button class="btn sm danger" data-d="${a.id}">Delete</button></div></div>`).join('')||'<p>None yet.</p>'}</div>`;
  $('#asv').onclick=async()=>{const v=id=>($('#'+id)||{}).value||'';const x=await api('asgSave',{id:edit?edit.id:'',title:v('at'),subject:v('as'),max:v('am'),due:v('ad'),instructions:v('ai'),closed:!!($('#ac')||{}).checked});if(!x.ok){$('#amg').innerHTML=`<div class="msg err">${esc(x.error)}</div>`;return}toast(edit?'Saved':'Homework published');adminAssign(ap)};
  const cn=$('#acn');if(cn)cn.onclick=()=>adminAssign(ap);
  ap.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>adminAsgSubs(ap,b.dataset.o));ap.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{adminAssign(ap,{edit:b.dataset.e});window.scrollTo(0,0)});
  ap.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this homework and every submission for it? This cannot be undone.'))return;const x=await api('asgDelete',{aid:b.dataset.d});toast(x.ok?'Deleted':x.error);adminAssign(ap)})}
async function adminAsgSubs(ap,aid){
